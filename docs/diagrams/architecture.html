<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shiro — system architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.875rem;
      line-height: 1.5;
      color: var(--color-muted);
      max-width: 60ch;
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · shiro (城)</p>
    <h1>One binary, two adapters, one canonical store</h1>
    <p class="subtitle">Everything routes through the SDK. SQLite holds the truth; the search indices are derived and thrown away on rebuild. Providers stay outside the port boundary.</p>

    <svg viewBox="0 0 960 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="shiro-arch-title shiro-arch-desc">
      <title id="shiro-arch-title">shiro — system architecture</title>
      <desc id="shiro-arch-desc">The JSON CLI and MCP server both call shiro-sdk, which writes canonical records to SQLite in shiro-store and queries the derived Tantivy and vector indices in shiro-index, which are rebuilt from canonical state; parser and embedding providers sit outside a port boundary defined by shiro-core.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ ZONES (drawn first) ============ -->
      <rect x="248" y="64" width="464" height="104" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="444" y="68" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="77" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">INTERFACES</text>

      <rect x="192" y="412" width="576" height="136" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="456" y="416" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="425" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">STATE</text>

      <!-- ============ ARROWS (before boxes) ============ -->

      <!-- 1. JSON CLI -> shiro-sdk -->
      <path d="M 368,152 V 204 Q 368,212 376,212 H 428 Q 436,212 436,220 V 256"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 2. MCP server -> shiro-sdk -->
      <path d="M 592,152 V 204 Q 592,212 584,212 H 532 Q 524,212 524,220 V 256"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 3. Parser adapters -> shiro-sdk (crosses the port boundary) -->
      <line x1="244" y1="292" x2="380" y2="292" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="280" y="272" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="312" y="281" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PARSER PORT</text>

      <!-- 4. shiro-sdk -> Embedding adapters (crosses the port boundary) -->
      <line x1="580" y1="292" x2="716" y2="292" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="606" y="272" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="648" y="281" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EMBED · RERANK</text>

      <!-- 5. shiro-sdk -> shiro-store -->
      <path d="M 428,328 V 376 Q 428,384 420,384 H 332 Q 324,384 324,392 V 444"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="356" y="364" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="376" y="373" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>

      <!-- 6. shiro-sdk -> shiro-index -->
      <path d="M 532,328 V 376 Q 532,384 540,384 H 628 Q 636,384 636,392 V 444"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="564" y="364" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="584" y="373" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUERY</text>

      <!-- 7. shiro-store -> shiro-index (canonical -> derived, ACCENT) -->
      <line x1="424" y1="480" x2="536" y2="480" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="454" y="460" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="469" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REBUILD</text>

      <!-- ============ NODES ============ -->

      <!-- JSON CLI -->
      <rect x="276" y="96" width="184" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="276" y="96" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="284" y="102" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="298" y="111" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="368" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">JSON CLI</text>
      <text x="368" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">envelope · stdout</text>

      <!-- MCP server -->
      <rect x="500" y="96" width="184" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="500" y="96" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="508" y="102" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="522" y="111" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
      <text x="592" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MCP server</text>
      <text x="592" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">json-rpc · stdio</text>

      <!-- Parser adapters (external / pluggable) -->
      <rect x="64" y="256" width="180" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="256" width="180" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="72" y="262" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="88" y="271" fill="rgba(45,49,66,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PORT</text>
      <text x="154" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Parser adapters</text>
      <text x="154" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shiro-parse · docling</text>

      <!-- shiro-sdk — FOCAL -->
      <rect x="380" y="256" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="256" width="200" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="388" y="262" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="402" y="271" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SDK</text>
      <text x="480" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">shiro-sdk</text>
      <text x="480" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ops · executor · spec · dsl</text>

      <!-- Embedding adapters (external / pluggable) -->
      <rect x="716" y="256" width="180" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="716" y="256" width="180" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="724" y="262" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="740" y="271" fill="rgba(45,49,66,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PORT</text>
      <text x="806" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Embedding adapters</text>
      <text x="806" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shiro-embed · fastembed</text>

      <!-- shiro-store — canonical -->
      <rect x="224" y="444" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="224" y="444" width="200" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="232" y="450" width="56" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="260" y="459" fill="rgba(79,93,117,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CANONICAL</text>
      <text x="324" y="482" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">shiro-store</text>
      <text x="324" y="498" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sqlite · lifecycle state</text>

      <!-- shiro-index — derived -->
      <rect x="536" y="444" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="536" y="444" width="200" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="544" y="450" width="48" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="568" y="459" fill="rgba(79,93,117,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DERIVED</text>
      <text x="636" y="482" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">shiro-index</text>
      <text x="636" y="498" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tantivy bm25 · flatindex</text>

      <!-- shiro-core — foundation bar -->
      <rect x="64" y="580" width="832" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="580" width="832" height="48" rx="6" fill="#ececec" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <rect x="88" y="598" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="106" y="607" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="144" y="608" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">shiro-core</text>
      <text x="232" y="608" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">domain types · ids · errors · port traits · invariants</text>
      <text x="872" y="608" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">depends on nothing</text>

      <!-- ============ LEGEND ============ -->
      <line x1="64" y1="668" x2="896" y2="668" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="64" y="684" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="64" y1="708" x2="96" y2="708" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="104" y="712" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">port boundary — provider swappable</text>

      <line x1="384" y1="708" x2="416" y2="708" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="424" y="712" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">derived from canonical, rebuildable</text>

      <rect x="704" y="700" width="32" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="744" y="712" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">orchestration hub</text>
    </svg>
  </div>
</body>
